<!-- Modal: 新增 / 編輯自購商品 -->
  <div id="modal-personal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <h2 id="modal-personal-title" class="text-lg font-bold text-slate-900">新增個人自購商品</h2>
      <form id="form-personal" class="space-y-3">
        <input type="hidden" name="id" id="personal-edit-id">
        <div>
          <label class="block text-xs font-medium text-slate-700">商品名稱 *</label>
          <input type="text" name="name" id="personal-field-name" required class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">商品圖片 URL</label>
          <input type="url" name="imageUrl" id="personal-field-image" placeholder="https://..." class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700">購買數量 *</label>
            <input type="number" name="quantity" id="personal-field-qty" min="1" value="1" required class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">單價 (NT$) *</label>
            <input type="number" name="price" id="personal-field-price" min="0" required class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">賣家 / 購買管道</label>
          <input type="text" name="channel" id="personal-field-channel" placeholder="例：煤爐代購、安利美特" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700">付款方式</label>
            <select name="payMethod" id="personal-paymethod-select" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
              <option value="取貨付款">取貨付款</option>
              <option value="全額匯款">全額匯款</option>
              <option value="訂金+尾款">訂金+尾款</option>
              <option value="信用卡">信用卡</option>
            </select>
          </div>
          <div id="field-deposit-container" class="hidden">
            <label class="block text-xs font-medium text-slate-700">已付訂金 (NT$) *</label>
            <input type="number" name="deposit" id="personal-field-deposit" min="0" value="0" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700">下單日期</label>
            <input type="date" name="orderDate" id="personal-field-orderdate" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">預計抵台月份</label>
            <input type="month" name="arrivalMonth" id="personal-field-arrival" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">物流進度</label>
          <select name="status" id="personal-field-status" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
            <option value="已喊單">已喊單</option>
            <option value="賣貨便已下單">賣貨便已下單</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">備註說明</label>
          <textarea name="notes" id="personal-field-notes" rows="2" placeholder="寄件單號、賣貨便單號等" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-3 border-t">
          <button type="button" id="btn-cancel-personal" class="px-4 py-2 border rounded-lg text-sm">取消</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: 新增 / 編輯主團 -->
  <div id="modal-group" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <h2 id="modal-group-title" class="text-lg font-bold text-slate-900">發起新揪團主檔</h2>
      <form id="form-group" class="space-y-3">
        <input type="hidden" name="id" id="group-edit-id">
        <div>
          <label class="block text-xs font-medium text-slate-700">商品名稱 *</label>
          <input type="text" name="name" id="group-field-name" required placeholder="例：咒術迴戰 盲盒徽章 全10種" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">商品圖片 URL</label>
          <input type="url" name="imageUrl" id="group-field-image" placeholder="https://..." class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700">揪團類別</label>
            <select name="category" id="group-field-category" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
              <option value="徽章拆團">徽章拆團</option>
              <option value="壓克力立牌">壓克力立牌</option>
              <option value="官方通販代購">官方通販代購</option>
              <option value="二手煤爐代切">二手煤爐代切</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">下單 / 預購日期</label>
            <input type="date" name="orderDate" id="group-field-orderdate" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700">總原幣 (JPY ¥)</label>
            <input type="number" name="costJpy" id="group-field-costjpy" min="0" value="0" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">台幣成本 (NT$) *</label>
            <input type="number" name="costTwd" id="group-field-costtwd" min="0" required value="0" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700">預估售價 (NT$)</label>
            <input type="number" name="targetPrice" id="group-field-targetprice" min="0" value="0" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">開團備註</label>
          <textarea name="notes" id="group-field-notes" rows="2" placeholder="匯率換算依據、國際運費每克計費公式、寄件包材規定等" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-3 border-t">
          <button type="button" id="btn-cancel-group" class="px-4 py-2 border rounded-lg text-sm">取消</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: 新增 / 編輯角色認領明細 -->
  <div id="modal-subitem" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
      <h2 id="modal-subitem-title" class="text-base font-bold text-slate-900">新增認領角色</h2>
      <form id="form-subitem" class="space-y-3">
        <input type="hidden" name="groupId" id="subitem-group-id">
        <input type="hidden" name="subitemId" id="subitem-edit-id">
        <div>
          <label class="block text-xs font-medium text-slate-700">角色 / 款式名稱 *</label>
          <input type="text" name="characterName" id="subitem-field-char" required placeholder="例：五條悟、A賞" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">認領買家暱稱 / 帳號</label>
          <input type="text" name="buyer" id="subitem-field-buyer" placeholder="買家帳號" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">拆團價格 (NT$) *</label>
          <input type="number" name="price" id="subitem-field-price" min="0" required value="0" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700">買家備註</label>
          <input type="text" name="buyerNote" id="subitem-field-note" placeholder="賣貨便、綁物說明等" class="w-full px-3 py-1.5 border rounded text-sm mt-1">
        </div>
        <div class="flex justify-end space-x-2 pt-3 border-t">
          <button type="button" id="btn-cancel-subitem" class="px-3 py-1.5 border rounded-lg text-xs">取消</button>
          <button type="submit" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 模組化入口腳本 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
