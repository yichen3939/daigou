<!-- Modal: 新增/修改自購商品 (片段) -->
<div id="modal-personal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
    <!-- 加入 id="modal-personal-title" -->
    <h2 id="modal-personal-title" class="text-lg font-bold text-slate-900">新增個人自購商品</h2>
    <form id="form-personal" class="space-y-3">
      <!-- 加入隱藏欄位記錄當前正在編輯的 ID -->
      <input type="hidden" id="personal-edit-id" name="editId">
      <div>
        <label class="block text-xs font-medium text-slate-700">商品名稱 *</label>
        <input type="text" name="name" required class="w-full px-3 py-1.5 border rounded text-sm mt-1">
      </div>
      <!-- 其餘表單欄位不變 ... -->
    </form>
  </div>
</div>

<!-- Modal: 新增/修改揪團主檔 (片段) -->
<div id="modal-group" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
    <!-- 加入 id="modal-group-title" -->
    <h2 id="modal-group-title" class="text-lg font-bold text-slate-900">發起新揪團主檔</h2>
    <form id="form-group" class="space-y-3">
      <!-- 加入隱藏欄位 -->
      <input type="hidden" id="group-edit-id" name="editId">
      <div>
        <label class="block text-xs font-medium text-slate-700">商品名稱 *</label>
        <input type="text" name="name" required class="w-full px-3 py-1.5 border rounded text-sm mt-1">
      </div>
      <!-- 其餘表單欄位不變 ... -->
    </form>
  </div>
</div>

<!-- Modal: 新增/修改角色認領 (片段) -->
<div id="modal-subitem" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
    <!-- 加入 id="modal-subitem-title" -->
    <h2 id="modal-subitem-title" class="text-base font-bold text-slate-900">新增認領角色</h2>
    <form id="form-subitem" class="space-y-3">
      <input type="hidden" name="groupId" id="subitem-group-id">
      <!-- 加入隱藏欄位 -->
      <input type="hidden" name="subitemId" id="subitem-edit-id">
      <div>
        <label class="block text-xs font-medium text-slate-700">角色 / 款式名稱 *</label>
        <input type="text" name="characterName" required class="w-full px-3 py-1.5 border rounded text-sm mt-1">
      </div>
      <!-- 其餘表單欄位不變 ... -->
    </form>
  </div>
</div>
